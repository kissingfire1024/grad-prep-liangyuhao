hydra:
  run:
    dir: ${paths.output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/eval.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - eval=exp009_heldout_recovery_screen
    - task_name=exp009_RMU_forget10_step0_18entity
    - model=Llama-3.2-1B-Instruct
    - model.model_args.pretrained_model_name_or_path=/home/research/open-unlearning/saves/unlearn/tofu_Llama-3.2-1B-Instruct_forget10_RMU_exp009
    - model.tokenizer_args.pretrained_model_name_or_path=/home/research/open-unlearning/saves/unlearn/tofu_Llama-3.2-1B-Instruct_forget10_RMU_exp009
    - model.model_args.attn_implementation=sdpa
    - paths.output_dir=/home/research/research/reproduction/09-multi-entity-validation/results/rmu_step0_18entity
  job:
    name: eval
    chdir: null
    override_dirname: eval=exp009_heldout_recovery_screen,model.model_args.attn_implementation=sdpa,model.model_args.pretrained_model_name_or_path=/home/research/open-unlearning/saves/unlearn/tofu_Llama-3.2-1B-Instruct_forget10_RMU_exp009,model.tokenizer_args.pretrained_model_name_or_path=/home/research/open-unlearning/saves/unlearn/tofu_Llama-3.2-1B-Instruct_forget10_RMU_exp009,model=Llama-3.2-1B-Instruct,paths.output_dir=/home/research/research/reproduction/09-multi-entity-validation/results/rmu_step0_18entity,task_name=exp009_RMU_forget10_step0_18entity
    id: ???
    num: ???
    config_name: eval.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /home/research/open-unlearning
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/research/open-unlearning/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/research/research/reproduction/09-multi-entity-validation/results/rmu_step0_18entity
    choices:
      experiment: null
      hydra: eval
      paths: default
      eval: exp009_heldout_recovery_screen
      generation@eval.tofu.metrics.exp009_heldout_Q_A_ROUGE.generation_args: default
      collator@eval.tofu.metrics.exp009_heldout_Q_A_ROUGE.collators: DataCollatorForSupervisedDatasetwithIndex
      data/datasets@eval.tofu.metrics.exp009_heldout_Q_A_ROUGE.datasets: TOFU_QA_forget
      collator@eval.tofu.metrics.exp009_heldout_Q_A_Prob.collators: DataCollatorForSupervisedDatasetwithIndex
      data/datasets@eval.tofu.metrics.exp009_heldout_Q_A_Prob.datasets: TOFU_QA_forget
      model: Llama-3.2-1B-Instruct
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
